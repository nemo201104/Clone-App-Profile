name: Manual release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v1.0.0 assets after reviewing the device acceptance results
        type: boolean
        required: true
        default: false
      expected_sha256:
        description: SHA-256 of the ZIP that passed the recorded device gate
        type: string
        required: true
permissions:
  contents: read
jobs:
  release:
    if: inputs.publish
    environment: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - run: |
          python3 tools/build.py
          python3 tools/check.py
      - name: Create reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          python3 tools/release_check.py --sha256 "$EXPECTED_SHA256"
          # Never move an existing tag or replace assets on a published release.
          refs=$(git ls-remote --tags origin refs/tags/v1.0.0)
          if [ -n "$refs" ]; then
            echo 'v1.0.0 already exists; inspect the release instead of overwriting it.' >&2
            exit 1
          fi
          gh release create v1.0.0 dist/Clone-App-Profile-v1.0.0.zip dist/Clone-App-Profile-v1.0.0.zip.sha256 dist/update.json --target "$GITHUB_SHA" --title 'Clone App Profile v1.0.0' --notes-file CHANGELOG.md
