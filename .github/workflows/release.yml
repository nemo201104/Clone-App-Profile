name: Manual release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v1.0.0 assets after reviewing the device acceptance results
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  release:
    if: inputs.publish
    environment: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - run: |
          python3 tools/build.py
          python3 tools/check.py
      - name: Create reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 dist/* --target "$GITHUB_SHA" --title 'Clone App Profile v1.0.0' --notes-file CHANGELOG.md
